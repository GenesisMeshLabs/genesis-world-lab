# Luanti server config for the GenesisMesh demo world.
# See docs/setup.md for how this fits together.

server_name = GenesisMesh Demo Server
server_description = Mineclonia + GenesisMesh trust and authority demo
default_game = mineclonia
load_mod_mineclonia = true
load_mod_genesismesh = true

# Keep the first server private/invite-only (section 7).
disallow_empty_password = true
enable_pvp = false

# The genesismesh mod needs outbound HTTP to reach the Game Bridge.
secure.http_mods = genesismesh
secure.trusted_mods =

# genesismesh mod settings (read via minetest.settings in init.lua).
genesismesh.bridge_url = http://bridge:8080
genesismesh.refresh_interval = 5
genesismesh.demo_area_pos1 = -16,-16,-16
genesismesh.demo_area_pos2 = 16,16,16
